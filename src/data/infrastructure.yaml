# Infraestructura del grupo (inicio + página /infraestructura). Campos _en = inglés.

- id: hpc
  order: 1
  title: Clúster de cómputo de alto rendimiento (HPC)
  title_en: High-performance computing (HPC) cluster
  text: Plataforma de cómputo del Departamento de Física financiada por FONDEQUIP (2023) y dirigida por el Dr. Victor Pinto. Se usa para entrenar modelos de machine learning, procesar grandes volúmenes de datos satelitales y ejecutar simulaciones numéricas.
  text_en: Computing platform at the Department of Physics, funded by FONDEQUIP (2023) and directed by Dr. Victor Pinto. Used to train machine learning models, process large satellite datasets, and run numerical simulations.
  link: https://fisica.usach.cl/es/plataforma-de-investigacion-hpc
  linkLabel: Plataforma HPC, Departamento de Física
  linkLabel_en: HPC platform, Department of Physics

- id: fondef-platform
  order: 2
  title: Plataforma piloto de clima espacial (FONDEF IDEA)
  title_en: Pilot space weather platform (FONDEF IDEA)
  text: Proyecto liderado por la Universidad Adventista de Chile, con la USACH como institución asociada (2025-2027). Desarrolla un sistema piloto de monitoreo en tiempo real y alertas tempranas de clima espacial para Chile, con modelos de pronóstico basados en deep learning.
  text_en: Project led by Universidad Adventista de Chile, with USACH as partner institution (2025-2027). It develops a pilot system for real-time space weather monitoring and early warnings in Chile, with deep-learning forecasting models.

- id: magnetometry
  order: 3
  title: Magnetometría
  title_en: Magnetometry
  text: Evaluación del desempeño de magnetómetros para monitoreo geomagnético, en colaboración con la Universidad Adventista de Chile, y análisis de datos de redes de magnetómetros en tierra para estudiar perturbaciones geomagnéticas y corrientes inducidas (GIC).
  text_en: Performance evaluation of magnetometers for geomagnetic monitoring, in collaboration with Universidad Adventista de Chile, and analysis of ground magnetometer network data to study geomagnetic disturbances and geomagnetically induced currents (GIC).
  link: https://doi.org/10.3390/s26154700
  linkLabel: Caro et al. (2026), Sensors
