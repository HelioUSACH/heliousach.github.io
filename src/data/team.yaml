# HelioFísica USACH — team roster.
#
# One entry per person. `status` controls which section of /equipo and
# /en/team they appear in, and (for pi/current-student) whether they show
# up in the homepage team teaser. Fields not in a given entry are simply
# omitted (e.g. students don't have `bio`, only PIs do).
#
# To add someone: copy an existing entry of the same `status`, give it a
# unique `id`, fill in the fields, done — no other file needs to change.

- id: victor-pinto
  status: pi
  order: 1
  name:
    es: "Dr. Victor A. Pinto Abarzúa"
    en: "Dr. Victor A. Pinto Abarzúa"
  role:
    es: "Profesor Asistente"
    en: "Assistant Professor"
  department:
    es: "Departamento de Física, USACH · Subdirector de Docencia"
    en: "Department of Physics, USACH · Associate Chair for Teaching"
  bio:
    es: "Ph.D. en Ciencias Atmosféricas y Oceánicas (Física Espacial), UCLA 2019 (co-directores: L. Lyons, J. Bortnik). Postdoctorado en UNH (2020-2022). Investigador en cinturones de radiación, ondas ULF, acoplamiento viento solar-magnetosfera, machine learning para clima espacial y corrientes inducidas geomagnéticamente (GIC). Editor asociado de Space Weather (AGU/Wiley)."
    en: "Ph.D. in Atmospheric and Oceanic Sciences (Space Physics), UCLA 2019 (co-advisors: L. Lyons, J. Bortnik). Postdoctoral research at UNH (2020-2022). Researcher in radiation belts, ULF waves, solar wind—magnetosphere coupling, machine learning for space weather, and geomagnetically induced currents (GIC). Associate Editor of Space Weather (AGU/Wiley)."
  miniRole:
    es: "Co-director, Profesor Asistente"
    en: "Co-lead, Assistant Professor"
  miniBio:
    es: "Ph.D. UCLA 2019. Cinturones de radiación, ondas ULF y machine learning para clima espacial."
    en: "Ph.D. UCLA 2019. Radiation belts, ULF waves, and machine learning for space weather."
  homeCardLink: "https://victorapinto.com"
  initials: "VP"
  links:
    site: "https://victorapinto.com"
    scholar: "https://scholar.google.com/citations?user=nEqGWqoAAAAJ"
    orcid: "https://orcid.org/0000-0003-1210-167X"

- id: marina-stepanova
  status: pi
  order: 2
  name:
    es: "Dra. Marina Stepanova"
    en: "Prof. Marina Stepanova"
  role:
    es: "Profesora Titular"
    en: "Professor"
  department:
    es: "Departamento de Física, USACH · Jefa de la carrera de Astrofísica"
    en: "Department of Physics, USACH · Head, B.S. Astrophysics Program"
  bio:
    es: "Ph.D. en Astrofísica, Instituto Skobeltsyn de Física Nuclear, Universidad Estatal Lomonósov de Moscú. En USACH desde 1995. Investigadora en plasmas espaciales, dinámica de la magnetosfera terrestre, turbulencia en plasmas, tormentas y subtormentas geomagnéticas, estabilidad de configuraciones de plasma y sistemas complejos. Colaboraciones activas con grupos de investigación en EE. UU. y Rusia. Ha supervisado más de 8 estudiantes de postgrado."
    en: "Ph.D. in Astrophysics, Skobeltsyn Institute of Nuclear Physics, Lomonosov Moscow State University. At USACH since 1995. Researcher in space plasmas, Earth's magnetospheric dynamics, turbulence in space plasmas, geomagnetic storms and substorms, plasma configuration stability, and complex systems. Active collaborations with research groups in the US and Russia. Has supervised 8+ graduate students."
  miniRole:
    es: "Co-directora, Profesora Titular"
    en: "Co-lead, Professor"
  miniBio:
    es: "Ph.D. Universidad Estatal de Moscú. Dinámica magnetosférica, turbulencia y tormentas geomagnéticas. En USACH desde 1995."
    en: "Ph.D. Moscow State University. Magnetospheric dynamics, turbulence, and geomagnetic storms. At USACH since 1995."
  initials: "MS"
  links:
    scholar: "https://scholar.google.com/citations?user=Rb-PfE4AAAAJ"
    anid: "https://investigadores.anid.cl/es/public_search/researcher?id=8491"

